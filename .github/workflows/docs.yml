name: Docs

# Builds the documentation on every pull request and publishes it as a
# preview, linked from a comment on the pull request and from the run summary:
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# Pushes to main (or running the workflow by hand on main) publish the
# documentation itself at the root of the same site.
# Both live on the gh-pages branch, which GitHub Pages must serve
# (Settings > Pages > Deploy from a branch > gh-pages, / (root)).

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'examples/notebooks/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:  # republish main by hand, e.g. after switching Pages to gh-pages

permissions:
  contents: write        # push to gh-pages
  pull-requests: write   # comment with the preview link

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pandoc
        if: github.event.action != 'closed'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: uv sync --group docs

      - name: Build docs
        if: github.event.action != 'closed'
        # .nojekyll: otherwise Pages runs Jekyll, which drops _static and _images.
        run: |
          uv run sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload the built site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Publish main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: Publish the pull-request preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      - name: Link the preview from the run summary
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/pr-preview/pr-${{ github.event.number }}/"
          echo "## [📖 Open the docs preview](${url})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published a minute or two after this run, by the Pages deployment." >> "$GITHUB_STEP_SUMMARY"
