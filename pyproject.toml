[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mpstab"
version = "0.1.0"
description = "Hybrid stabilizer tensor-network simulator for quantum circuits"
authors = [
    {name = "Matteo Robbiati"},
    {name = "Giulio Crognaletti"},
    {name = "Mattia Robbiano"},
    {name = "Roberto Di Lauro"},
    {name = "Michele Grossi"},
]
readme = "README.md"
license = "Apache-2.0"
keywords = ["quantum computing", "quantum circuits", "simulation", "stabilizer", "tensor networks", "MPO", "qibo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "qibo>=0.3.6",
    "stim>=1.15.0",
    "quimb>=1.12.1",
]

[project.optional-dependencies]
pytorch = ["torch"]
jax = ["jax"]

[project.urls]
Documentation = "https://matteorobbiati.github.io/mpstab/"
Repository = "https://github.com/MatteoRobbiati/mpstab"
Issues = "https://github.com/MatteoRobbiati/mpstab/issues"
Paper = "https://arxiv.org/abs/2607.24258"

[tool.hatch.build.targets.wheel]
packages = ["src/mpstab"]

[dependency-groups]
dev = [
    "ipython>=7.34",
    "matplotlib>=3.10.0",
    "pdbpp>=0.10.3",
]
test = [
    "matplotlib>=3.10.0",
    "pytest>=7.2.1",
    "pytest-cov==4.0.0",
]
# rustiq is not on PyPI, so it lives in a dependency group (never in the published metadata)
rustiq = [
    "rustiq @ git+https://github.com/smartiel/rustiq.git",
]
benchmark = [
    "pytest-benchmark[histogram]>=4.0.0",
]
docs = [
    "Sphinx>=7.0.0",
    "furo>=2024.1.5",
    "nbsphinx>=0.9.3",
    "ipykernel>=6.29.0",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-katex>=0.9.9",
    "pandoc>=2.4",
]

[tool.coverage.run]
source = ["mpstab"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
