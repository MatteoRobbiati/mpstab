[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpstab"
version = "0.0.1"
description = "Hybrid stabilizers - tensor network simulator for quantum circuits"
authors = [
    {name = "Matteo Robbiati"},
    {name = "Giulio Crognaletti"},
    {name = "Mattia Robbiano"},
    {name = "Michele Grossi"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "qibo>=0.2.19",
    "click>=8.1.0",
    "cotengra",
    "matplotlib>=3.10.0",
    "stim>=1.15.0",
    "quimb>=1.12.1",
]

[project.optional-dependencies]
pytorch = ["torch"]
jax = ["jax"]
rustiq = ["rustiq @ git+https://github.com/smartiel/rustiq.git"]

[project.urls]
Repository = "https://github.com/MatteoRobbiati/mpstab/"

[tool.hatch.build.targets.wheel]
packages = ["src/mpstab"]

[dependency-groups]
dev = [
    "ipython>=7.34",
    "pdbpp>=0.10.3",
    "poethepoet>=0.24.0",
]
test = [
    "pytest>=7.2.1",
    "pylint==3.1.0",
    "pytest-cov==4.0.0",
]
benchmark = [
    "pytest-benchmark[histogram]>=4.0.0",
]
docs = [
    "Sphinx>=7.0.0",
    "furo>=2024.1.5",
    "nbsphinx>=0.9.3",
    "ipykernel>=6.29.0",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-katex>=0.9.9",
    "pandoc>=2.4",
]

[tool.poe.tasks]
test = "pytest"
bench = "pytest benchmarks/ --benchmark-warmup=on --benchmark-warmup-iterations=100000 --benchmark-disable-gc --benchmark-histogram=bench-hists/bench"
lint = "pylint src/**/*.py -E"
lint-warnings = "pylint src/**/*.py --exit-zero"
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--cov=mpstab",
  "--cov-append",
  "--cov-report=xml",
  "--cov-report=html",
  "--durations=60",
]
