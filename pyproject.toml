[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpstab"
version = "0.0.1"
description = "Hybrid stabilizers - tensor network simulator for quantum circuits"
authors = [
    {name = "Matteo Robbiati"},
    {name = "Giulio Crognaletti"},
    {name = "Mattia Robbiano"},
    {name = "Roberto Di Lauro"},
    {name = "Michele Grossi"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "qibo>=0.3.6",
    "cotengra",
    "stim>=1.15.0",
    "quimb>=1.12.1",
]

[project.optional-dependencies]
pytorch = ["torch"]
jax = ["jax"]
rustiq = ["rustiq @ git+https://github.com/smartiel/rustiq.git"]

[project.urls]
Repository = "https://github.com/MatteoRobbiati/mpstab/"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mpstab"]

[dependency-groups]
dev = [
    "ipython>=7.34",
    "matplotlib>=3.10.0",
    "pdbpp>=0.10.3",
]
test = [
    "matplotlib>=3.10.0",
    "pytest>=7.2.1",
    "pytest-cov==4.0.0",
]
benchmark = [
    "pytest-benchmark[histogram]>=4.0.0",
]
docs = [
    "Sphinx>=7.0.0",
    "furo>=2024.1.5",
    "nbsphinx>=0.9.3",
    "ipykernel>=6.29.0",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-katex>=0.9.9",
    "pandoc>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
