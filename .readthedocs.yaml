version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # nbsphinx converts the notebooks with pandoc.
  apt_packages:
    - pandoc
  jobs:
    install:
      - pip install uv
      - uv sync --group docs
    build:
      html:
        - uv run sphinx-build -T -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
